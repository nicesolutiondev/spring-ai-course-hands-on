plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'hn'
version = '0.0.1-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

ext {
    set('springAiVersion', "1.1.8")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'

    // Spring Boot BOM 은 jsoup 을 관리하지 않는다. 버전을 직접 고정한다.
    implementation 'org.jsoup:jsoup:1.23.2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    // playground 는 OPENAI_API_KEY 가 있어야 돌아간다. 기본 test 에 섞으면
    // "안전 필터링 2건만 실패한다" 는 기준이 흐려지므로 빼 둔다.
    useJUnitPlatform { excludeTags 'playground' }
}

/** 프롬프트 실험과 연결 확인. 키가 필요하다. */
tasks.register('playground', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'playground' }
    testLogging { showStandardStreams = true }
    outputs.upToDateWhen { false }
}

/**
 * 프론트엔드 빌드. Vite 의 outDir 이 src/main/resources/static 이라 복사 단계가 없다.
 *
 * build 태스크에 연결하지 않는다. 연결하면 Node 가 없는 환경에서 bootRun 이 깨진다.
 * 빌드 산출물이 커밋돼 있으므로 소스를 고쳤을 때만 이 태스크를 돌린다.
 */
tasks.register('buildFrontend', Exec) {
    workingDir 'frontend'
    def windows = System.getProperty('os.name').toLowerCase().contains('windows')
    commandLine windows ? ['npm.cmd', 'run', 'build'] : ['npm', 'run', 'build']
}
